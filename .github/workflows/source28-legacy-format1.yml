    steps:
      - name: Refuse pending outer root admission before checkout or guest actions
        shell: bash
        run: |
          set -euo pipefail
          [[ "$L1_ADMISSION_SHA256" =~ ^[a-f0-9]{64}$ && "$L1_ROOT_APPROVAL_SHA256" =~ ^[a-f0-9]{64}$ ]] || { echo 'L1 root admission is PENDING'; exit 1; }
      - name: Checkout actual sole-parent operator W
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: operator
          fetch-depth: 2
          persist-credentials: false
      - name: Checkout immutable clean source28
        uses: actions/checkout@v4
        with:
          ref: 6378b0ae9d15f17481b080926af7fb0bf0761724
          path: application
          persist-credentials: false
      - name: Materialize and validate private root admission
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 -I -B - <<'PY'
          import os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'l1-admission.json'
          with p.open('xb') as f:f.write(os.environ['L1_ADMISSION_JSON'].encode())
          p.chmod(0o600)
          PY
          python3 -I -B "$GITHUB_WORKSPACE/operator/.github/source28-l1/l1.py" validate --admission "$RUNNER_TEMP/l1-admission.json" --admission-sha256 "$L1_ADMISSION_SHA256" --root-approval-sha256 "$L1_ROOT_APPROVAL_SHA256"
      - name: Execute one fixed owned L1 experiment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          python3 -I -B "$GITHUB_WORKSPACE/operator/.github/source28-l1/l1.py" run --admission "$RUNNER_TEMP/l1-admission.json" --admission-sha256 "$L1_ADMISSION_SHA256" --root-approval-sha256 "$L1_ROOT_APPROVAL_SHA256" --application "$GITHUB_WORKSPACE/application" --operator "$GITHUB_WORKSPACE/operator"
      - name: Upload literal safe projections only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source28-L1-${{ github.run_id }}-1
          retention-days: 3
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/l1-public/l1-bootstrap.json
            ${{ runner.temp }}/l1-public/l1-result.json
            ${{ runner.temp }}/l1-public/l1-cleanup.json
            ${{ runner.temp }}/l1-public/l1-r9-initial.json
            ${{ runner.temp }}/l1-public/l1-r9-initial.execution.json
            ${{ runner.temp }}/l1-public/l1-r9-boot1.json
            ${{ runner.temp }}/l1-public/l1-r9-boot1.execution.json
            ${{ runner.temp }}/l1-public/l1-r9-boot2.json
            ${{ runner.temp }}/l1-public/l1-r9-boot2.execution.json
