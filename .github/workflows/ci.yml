name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      qualify_native:
        description: Run both Ubuntu 26.04 architecture qualification cells (requires configured signed artifacts)
        type: boolean
        default: false
      qualification_artifacts:
        description: Optional per-architecture artifact JSON (otherwise repository variable NAKPANEL_QUALIFICATION_ARTIFACTS)
        type: string
        required: false
      allow_development_artifacts:
        description: Explicitly permit development signatures; resulting evidence cannot promote
        type: boolean
        default: false
      verify_database_manager:
        description: Require optional database manager FastCGI and browser qualification
        type: boolean
        default: false
      build_private_php:
        description: Build unqualified private PHP candidates on isolated native runners
        type: boolean
        default: false

# The security suite is a required gate: no production deploy until both jobs
# below are green. Mark `unit` and `security-suite` as required status checks
# in branch protection for `main`.
jobs:
  unit:
    name: unit + generated-code + go test
    runs-on: ubuntu-24.04
    env:
      NAKPANEL_REQUIRE_PLAN_PHP_POSTGRES: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: deploy/release/GO_VERSION
          cache: true
      - name: Verify generated code is committed (templ/sqlc)
        run: |
          make generate
          git diff --exit-code || { echo "generated code is stale; run 'make generate'"; exit 1; }
      - name: Release manifest and private package policies
        run: make release-test
      - name: go vet
        run: go vet ./...
      - name: Start private PostgreSQL for production-schema regression tests
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          pg_bin=/usr/lib/postgresql/16/bin
          if [[ ! -x "${pg_bin}/initdb" ]]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends postgresql-16
          fi
          pg_root="${RUNNER_TEMP}/nakpanel-unit-postgres"
          pg_user="$(id -un)"
          [[ "${pg_root}" =~ ^/[a-zA-Z0-9_./-]+$ && "${pg_user}" =~ ^[a-zA-Z0-9_-]+$ ]]
          mkdir -m 0700 "${pg_root}"
          mkdir -m 0700 "${pg_root}/socket"
          printf 'NAKPANEL_UNIT_PG_OWNED=1\n' >>"${GITHUB_ENV}"
          "${pg_bin}/initdb" -D "${pg_root}/data" -U "${pg_user}" --auth-local=trust --auth-host=reject --encoding=UTF8 --no-locale >/dev/null
          "${pg_bin}/pg_ctl" -D "${pg_root}/data" -l "${pg_root}/server.log" -o "-c listen_addresses='' -k ${pg_root}/socket -p 55439" -w -t 30 start
          # Production advisory-lock keys are database-wide. Separate fixture
          # databases keep package-concurrent tests isolated, including seed IDs.
          for pg_database in nakpanel_native_fixture nakpanel_plan_php; do
            "${pg_bin}/createdb" --host="${pg_root}/socket" --port=55439 --username="${pg_user}" "${pg_database}"
          done
          observed="$("${pg_bin}/psql" -XAt --host="${pg_root}/socket" --port=55439 --username="${pg_user}" --dbname=nakpanel_native_fixture -c "SELECT current_setting('data_directory') || '|' || (inet_server_addr() IS NULL AND current_setting('listen_addresses')='')::text")"
          [[ "${observed}" == "${pg_root}/data|true" ]]
          native_dsn="host=${pg_root}/socket port=55439 user=${pg_user} dbname=nakpanel_native_fixture sslmode=disable"
          plan_dsn="host=${pg_root}/socket port=55439 user=${pg_user} dbname=nakpanel_plan_php sslmode=disable"
          printf 'NAKPANEL_NATIVE_FIXTURE_TEST_DSN=%s\nNAKPANEL_PLAN_PHP_TEST_DSN=%s\n' "${native_dsn}" "${plan_dsn}" >>"${GITHUB_ENV}"
          printf '%s\n' "${pg_bin}" >>"${GITHUB_PATH}"
      - name: go test (includes the in-process security guards)
        run: go test ./... -count=1
      - name: Stop only the unit-owned PostgreSQL instance
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          [[ "${NAKPANEL_UNIT_PG_OWNED:-}" == 1 ]] || exit 0
          pg_root="${RUNNER_TEMP}/nakpanel-unit-postgres"
          if [[ -f "${pg_root}/data/postmaster.pid" ]]; then
            /usr/lib/postgresql/16/bin/pg_ctl -D "${pg_root}/data" -m fast -w -t 30 stop
          fi

  security-suite:
    name: adversarial security + reliability gate (Multipass)
    # Keep this check's identity stable. Even a failed/cancelled artifact build
    # must produce a failed security check rather than a skipped required job.
    needs: release-build
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
    env:
      NAKPANEL_MULTIPASS_ARCH: amd64
      NAKPANEL_MULTIPASS_IMAGE: '26.04'
      NAKPANEL_QUALIFICATION_PHP_PROVIDER: sury
      NAKPANEL_RELEASE_ALLOW_DEVELOPMENT: '1'
      NAKPANEL_QUALIFICATION_VM_CPUS: '2'
      NAKPANEL_QUALIFICATION_VM_MEMORY: 5G
      NAKPANEL_QUALIFICATION_VM_DISK: 32G
      NAKPANEL_QUALIFICATION_DR_CPUS: '2'
      NAKPANEL_QUALIFICATION_DR_MEMORY: 3G
      NAKPANEL_QUALIFICATION_DR_DISK: 16G
    steps:
      - uses: actions/checkout@v4
      - name: Require the signed application build
        env:
          RELEASE_BUILD_RESULT: ${{ needs.release-build.result }}
        run: |
          set -euo pipefail
          [[ "${RELEASE_BUILD_RESULT}" == success ]] || { echo 'Required signed application build did not succeed.' >&2; exit 1; }
      - name: Isolate host Go state
        shell: bash
        run: |
          printf 'GOPATH=%s/nakpanel-go\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'GOCACHE=%s/nakpanel-go-build\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'GOMODCACHE=%s/nakpanel-go/pkg/mod\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v5
        with:
          go-version-file: deploy/release/GO_VERSION
          cache: false
      - uses: actions/download-artifact@v4
        with:
          name: ci-security-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/security-release
      - name: Validate the exact signed AMD64 CI artifact
        run: |
          set -euo pipefail
          python3 - <<'PYBUNDLE'
          import os,pathlib,subprocess,sys,tarfile,uuid
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'security-release'
          unpacked=root/'unpacked';unpacked.mkdir(mode=0o700)
          with tarfile.open(root/'bundle.tar.gz') as archive:
              seen=set()
              for member in archive.getmembers():
                  path=pathlib.PurePosixPath(member.name)
                  if path.is_absolute() or '..' in path.parts or member.name in seen or not (member.isfile() or member.isdir()):
                      raise ValueError('unsafe signed application archive member')
                  seen.add(member.name)
              archive.extractall(unpacked)
          directories=list(unpacked.iterdir())
          assert len(directories)==1 and directories[0].is_dir(), 'one signed application bundle is required'
          bundle=directories[0]; key=root/'public.pem'; version=(bundle/'VERSION').read_text().strip()
          subprocess.run([sys.executable,'deploy/release/verify.py','--bundle',str(bundle),'--public-key',str(key),'--version',version,'--architecture','amd64','--allow-development'],check=True)
          exports={'NAKPANEL_RELEASE_BUNDLE':str(bundle),'NAKPANEL_RELEASE_PUBLIC_KEY':str(key),'NAKPANEL_RELEASE_VERSION':version}
          with open(os.environ['GITHUB_ENV'],'a') as output:
              for name,value in sorted(exports.items()):
                  delimiter=uuid.uuid4().hex;output.write(f'{name}<<{delimiter}\n{value}\n{delimiter}\n')
          PYBUNDLE
      - name: Prepare only this disposable hosted runner
        run: bash deploy/multipass/prepare-hosted-runner.sh
      - name: Stage the pinned signed Resolute cloud image
        env:
          RESOLUTE_SERIAL: '20260927'
          RESOLUTE_SHA256: '8800651811af9a85465ad1d552add729947bb16488dddb4a9b5305a3d97332b2'
        run: |
          set -euo pipefail
          python3 - <<'PYIMAGE'
          import hashlib,json,os,pathlib,re,subprocess,uuid
          serial=os.environ['RESOLUTE_SERIAL']; expected=os.environ['RESOLUTE_SHA256'].lower()
          assert re.fullmatch(r'20[0-9]{6}(\.[0-9]+)?',serial), 'invalid pinned Resolute image serial'
          assert re.fullmatch(r'[a-f0-9]{64}',expected), 'exact pinned image SHA256 required'
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          evidence=root/'hosted-evidence'/'resolute-image';evidence.mkdir(parents=True,mode=0o700)
          images=root/'hosted-images';images.mkdir(mode=0o700)
          base=f'https://cloud-images.ubuntu.com/releases/resolute/release-{serial}/'
          for name in ('SHA256SUMS','SHA256SUMS.gpg'):
              subprocess.run(['curl','--fail','--location','--retry','3','--proto','=https','--proto-redir','=https',base+name,'--output',str(evidence/name)],check=True)
          subprocess.run(['gpgv','--keyring','/usr/share/keyrings/ubuntu-cloudimage-keyring.gpg',str(evidence/'SHA256SUMS.gpg'),str(evidence/'SHA256SUMS')],check=True)
          filename='ubuntu-26.04-server-cloudimg-amd64.img'
          matches=[parts[0] for line in (evidence/'SHA256SUMS').read_text().splitlines() if len(parts:=line.split())==2 and parts[1].lstrip('*')==filename]
          assert matches==[expected], 'pinned SHA256 differs from signed Ubuntu image manifest'
          image=images/filename
          subprocess.run(['curl','--fail','--location','--retry','3','--proto','=https','--proto-redir','=https',base+filename,'--output',str(image)],check=True)
          digest=hashlib.sha256()
          with image.open('rb') as source:
              for block in iter(lambda:source.read(2**20),b''):digest.update(block)
          assert digest.hexdigest()==expected, 'downloaded cloud-image SHA256 mismatch'
          (evidence/'selection.json').write_text(json.dumps(dict(release='26.04',architecture='amd64',serial=serial,sha256=expected,url=base+filename),indent=2)+'\n')
          exports={'NAKPANEL_MULTIPASS_IMAGE_SOURCE':str(image.resolve()),'NAKPANEL_MULTIPASS_IMAGE_SHA256':expected}
          with open(os.environ['GITHUB_ENV'],'a') as output:
              for name,value in sorted(exports.items()):
                  delimiter=uuid.uuid4().hex;output.write(f'{name}<<{delimiter}\n{value}\n{delimiter}\n')
          PYIMAGE
      - name: Require actual KVM and measured capacity before guest launch
        run: python3 deploy/multipass/hosted-runner-preflight.py --output "${RUNNER_TEMP}/hosted-evidence/host-preflight.json"
      - name: Initialize unique owned security guests
        shell: bash
        run: |
          set -euo pipefail
          source deploy/multipass/common.sh
          export NAKPANEL_RUN_TOKEN="ci-security-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          init_qualification_run
          export NAKPANEL_CI_OWNERSHIP_READY=1
          python3 - <<'PYENV'
          import os, uuid
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              for key, value in sorted(os.environ.items()):
                  if key.startswith('NAKPANEL_'):
                      delimiter = uuid.uuid4().hex
                      output.write(f'{key}<<{delimiter}\n{value}\n{delimiter}\n')
          PYENV
      - name: Install the signed candidate on a fresh Resolute guest
        run: ./deploy/multipass/current-install-verify.sh
      - name: Establish the native container fixture
        env:
          NAKPANEL_SKIP_PRIOR_PHASES: '1'
        run: ./deploy/multipass/phase28-verify.sh
      - name: Run the adversarial validation suite (Parts A-H)
        shell: bash
        env:
          NAKPANEL_SKIP_PRIOR_PHASES: '1'
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/security-evidence"
          ./deploy/multipass/security-verify.sh 2>&1 | tee "${RUNNER_TEMP}/security-evidence/security.log"
      - name: Run the Phase 29 reliability gate (upgrade, reboot, DR)
        shell: bash
        env:
          NAKPANEL_SKIP_PRIOR_PHASES: '1'
          NAKPANEL_CELL_REPORT_DIR: ${{ runner.temp }}/security-evidence
        run: |
          set -euo pipefail
          ./deploy/multipass/phase29-verify.sh 2>&1 | tee "${RUNNER_TEMP}/security-evidence/phase29.log"
      - name: Clean up only this run's owned guests
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          source deploy/multipass/common.sh
          expected_token="ci-security-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if [[ "${NAKPANEL_CI_OWNERSHIP_READY:-}" != 1 || "${NAKPANEL_RUN_TOKEN:-}" != "${expected_token}" ]]; then exit 0; fi
          status=0
          # Enumerate only this run's host ownership records, never the VM inventory.
          for record in "${NAKPANEL_OWNERSHIP_DIR}/${NAKPANEL_RUN_TOKEN}"/nakpanel-*; do
            [[ -f "${record}" && "${record}" != *.image.json ]] || continue
            destroy_owned_vm "$(basename "${record}")" "${NAKPANEL_RUN_TOKEN}" || status=1
          done
          exit "${status}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/security-evidence/
            ${{ runner.temp }}/hosted-evidence/
          if-no-files-found: warn

  release-build:
    name: static release build policy (both architectures)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Isolate host Go state
        shell: bash
        run: |
          printf 'GOPATH=%s/nakpanel-go\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'GOCACHE=%s/nakpanel-go-build\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'GOMODCACHE=%s/nakpanel-go/pkg/mod\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v5
        with:
          go-version-file: deploy/release/GO_VERSION
          cache: true
      # Ephemeral CI key exercises signing; these are explicitly test artifacts.
      # Production uses build.sh with the separately managed release key.
      - name: Build and inspect application bundles
        run: |
          set -euo pipefail
          openssl genrsa -out "${RUNNER_TEMP}/release-test-key.pem" 3072
          # A tracked README marker makes this an explicit development build
          # without changing the application's comparable VERSION contract.
          printf '\n<!-- CI development qualification %s -->\n' "${GITHUB_RUN_ID}" >> README.md
          NAKPANEL_RELEASE_ALLOW_DIRTY=1 NAKPANEL_RELEASE_SIGNING_KEY="${RUNNER_TEMP}/release-test-key.pem" ./deploy/release/build.sh "${RUNNER_TEMP}/release"
          # Publish only the exact AMD64 test bundle and its out-of-band public
          # key. The ephemeral private signing key remains outside this tree.
          mkdir -p "${RUNNER_TEMP}/security-release"
          version="$(tr -d '[:space:]' < VERSION)"
          # The tar preserves executable permissions across Actions artifact transport.
          tar -C "${RUNNER_TEMP}/release" -czf "${RUNNER_TEMP}/security-release/bundle.tar.gz" "nakpanel-${version}-linux-amd64"
          openssl pkey -in "${RUNNER_TEMP}/release-test-key.pem" -pubout -out "${RUNNER_TEMP}/security-release/public.pem"
      - uses: actions/upload-artifact@v4
        with:
          name: ci-security-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/security-release/
          retention-days: 3
          if-no-files-found: error
      - name: Remove ephemeral release signing key
        if: always()
        run: rm -f "${RUNNER_TEMP}/release-test-key.pem"

  private-php-candidates:
    if: github.event_name == 'workflow_dispatch' && inputs.build_private_php
    name: private PHP candidates (${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        architecture: [amd64, arm64]
    # These dedicated ephemeral native Resolute runners must be provisioned with
    # build-dependencies.txt. Candidates are installed only into this disposable
    # builder for smoke tests; no repository is published.
    runs-on: [self-hosted, isolated-php-builder, resolute, "${{ matrix.architecture }}"]
    steps:
      - uses: actions/checkout@v4
      - name: Build native 8.3 and 8.4 candidates with upstream verification
        env:
          PHP_RELEASE_KEYRING_BASE64: ${{ secrets.PHP_RELEASE_KEYRING_BASE64 }}
          NAKPANEL_BUILDER_ID: ${{ vars.PHP_BUILDER_ID }}
          NAKPANEL_BUILDER_IMAGE_DIGEST: ${{ vars.PHP_BUILDER_IMAGE_DIGEST }}
          NAKPANEL_BUILD_INVOCATION_ID: ${{ github.run_id }}-${{ matrix.architecture }}
        run: |
          printf '%s' "$PHP_RELEASE_KEYRING_BASE64" | base64 --decode > "${RUNNER_TEMP}/php-release-keyring.gpg"
          export PHP_RELEASE_KEYRING="${RUNNER_TEMP}/php-release-keyring.gpg"
          export NAKPANEL_ISOLATED_PHP_BUILDER=1
          for minor in 8.3 8.4; do
            sudo env NAKPANEL_ISOLATED_PHP_BUILDER=1 \
              NAKPANEL_BUILDER_ID="$NAKPANEL_BUILDER_ID" \
              NAKPANEL_BUILDER_IMAGE_DIGEST="$NAKPANEL_BUILDER_IMAGE_DIGEST" \
              NAKPANEL_BUILD_INVOCATION_ID="$NAKPANEL_BUILD_INVOCATION_ID" \
              PHP_RELEASE_KEYRING="$PHP_RELEASE_KEYRING" \
              ./deploy/release/php/build-native.sh "$minor" "${RUNNER_TEMP}/php-candidates"
            sudo dpkg -i "${RUNNER_TEMP}/php-candidates/nakpanel-php${minor//./}_"*.deb
            sudo env NAKPANEL_ISOLATED_PHP_BUILDER=1 \
              ./deploy/release/php/smoke-native.sh "$minor" \
              "${RUNNER_TEMP}/php-candidates/evidence-${minor}-${{ matrix.architecture }}"
          done
      - name: Sign candidate inventory with managed release key
        env:
          PHP_CANDIDATE_SIGNING_KEY: ${{ secrets.PHP_CANDIDATE_SIGNING_KEY }}
        run: |
          umask 077
          printf '%s' "$PHP_CANDIDATE_SIGNING_KEY" > "${RUNNER_TEMP}/php-signing-key.pem"
          sudo env NAKPANEL_RELEASE_SIGNING_KEY="${RUNNER_TEMP}/php-signing-key.pem" ./deploy/release/php/sign-candidates.sh "${RUNNER_TEMP}/php-candidates"
          rm -f "${RUNNER_TEMP}/php-signing-key.pem"
      - uses: actions/upload-artifact@v4
        with:
          name: unqualified-private-php-${{ matrix.architecture }}
          path: ${{ runner.temp }}/php-candidates/
      - name: Remove temporary trust/signing files
        if: always()
        run: rm -f "${RUNNER_TEMP}/php-release-keyring.gpg" "${RUNNER_TEMP}/php-signing-key.pem"

  native-qualification:
    if: github.event_name == 'workflow_dispatch' && inputs.qualify_native
    name: native Ubuntu ${{ matrix.release }} / ${{ matrix.architecture }}
    runs-on: [self-hosted, multipass, nakpanel-qualification, "${{ matrix.architecture }}"]
    timeout-minutes: 360
    concurrency:
      group: native-qualification-${{ matrix.architecture }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - release: '26.04'
            architecture: amd64
          - release: '26.04'
            architecture: arm64
    env:
      NAKPANEL_MULTIPASS_IMAGE: ${{ matrix.release }}
      NAKPANEL_MULTIPASS_ARCH: ${{ matrix.architecture }}
      NAKPANEL_QUALIFICATION_PHP_PROVIDER: sury
      NAKPANEL_RELEASE_ALLOW_DEVELOPMENT: ${{ inputs.allow_development_artifacts && '1' || '0' }}
      NAKPANEL_VERIFY_DATABASE_MANAGER: ${{ inputs.verify_database_manager && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: deploy/release/GO_VERSION
      - name: Validate configured signed artifacts before VM work
        shell: bash
        env:
          QUALIFICATION_ARTIFACTS_JSON: ${{ inputs.qualification_artifacts || vars.NAKPANEL_QUALIFICATION_ARTIFACTS }}
        run: |
          set -euo pipefail
          python3 - <<'PYCONFIG'
          import json, os, pathlib, re, subprocess, sys, uuid
          arch = os.environ['NAKPANEL_MULTIPASS_ARCH']
          release = os.environ['NAKPANEL_MULTIPASS_IMAGE']
          report = pathlib.Path(os.environ['RUNNER_TEMP'], f'native-preflight-{release}-{arch}.json')
          status = dict(release=release, architecture=arch, status='FAIL', promotion_eligible=False)
          try:
              raw = os.environ.get('QUALIFICATION_ARTIFACTS_JSON', '')
              if not raw:
                  raise ValueError('Configure qualification_artifacts or repository variable NAKPANEL_QUALIFICATION_ARTIFACTS; signed current bundles, trust anchors and exact versions are required')
              config = json.loads(raw)[arch]
              exports = {}
              for prefix, key in [('NAKPANEL_RELEASE_', 'current')]:
                  artifact = config[key]
                  for field, suffix in [('bundle', 'BUNDLE'), ('public_key', 'PUBLIC_KEY'), ('version', 'VERSION')]:
                      value = artifact.get(field)
                      if not isinstance(value, str) or not value or any(ord(c) < 32 for c in value):
                          raise ValueError(f'{arch}.{key}.{field} is required and must be a nonempty string')
                      exports[prefix + suffix] = value
                  bundle, public_key = pathlib.Path(artifact['bundle']), pathlib.Path(artifact['public_key'])
                  if not bundle.is_absolute() or not bundle.is_dir() or not public_key.is_absolute() or not public_key.is_file():
                      raise ValueError(f'{arch}.{key}: absolute pre-staged bundle directory and out-of-band public key file are required on the native runner')
                  if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+([+-][A-Za-z0-9.-]+)?', artifact['version']):
                      raise ValueError(f'{arch}.{key}.version must be an exact application version')
                  args = [sys.executable, 'deploy/release/verify.py', '--bundle', str(bundle), '--public-key', str(public_key), '--version', artifact['version'], '--architecture', arch]
                  if os.environ['NAKPANEL_RELEASE_ALLOW_DEVELOPMENT'] == '1':
                      args.append('--allow-development')
                  subprocess.run(args, check=True)
              for version, prefix in [(release, 'NAKPANEL_MULTIPASS_IMAGE_')]:
                  image = config.get('images', {}).get(version, {})
                  source, digest = image.get('source', ''), image.get('sha256', '')
                  if bool(source) != bool(digest):
                      raise ValueError(f'{arch}.images.{version} requires both source and sha256')
                  if source:
                      if not pathlib.Path(source).is_absolute() or not pathlib.Path(source).is_file() or not re.fullmatch(r'[a-fA-F0-9]{64}', digest):
                          raise ValueError(f'{arch}.images.{version} requires an absolute local image and exact SHA256')
                      exports[prefix + 'SOURCE'] = source
                      exports[prefix + 'SHA256'] = digest
              with open(os.environ['GITHUB_ENV'], 'a') as output:
                  for key, value in sorted(exports.items()):
                      delimiter = uuid.uuid4().hex
                      output.write(f'{key}<<{delimiter}\n{value}\n{delimiter}\n')
              status.update(status='PASS', configured_architecture=arch, development_opt_in=os.environ['NAKPANEL_RELEASE_ALLOW_DEVELOPMENT']=='1')
          except Exception as error:
              status['error'] = str(error)
              print('Native qualification configuration failed: ' + str(error), file=sys.stderr)
              report.write_text(json.dumps(status, indent=2) + '\n')
              raise SystemExit(1)
          report.write_text(json.dumps(status, indent=2) + '\n')
          PYCONFIG
      - name: Initialize unique owned native cell
        shell: bash
        run: |
          set -euo pipefail
          source deploy/multipass/common.sh
          export NAKPANEL_RUN_TOKEN="ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${NAKPANEL_MULTIPASS_IMAGE//./-}-${NAKPANEL_MULTIPASS_ARCH}"
          init_qualification_run
          export NAKPANEL_CI_OWNERSHIP_READY=1
          export NAKPANEL_CELL_REPORT_DIR="${RUNNER_TEMP}/native-evidence-${NAKPANEL_MULTIPASS_IMAGE}-${NAKPANEL_MULTIPASS_ARCH}"
          python3 - <<'PYENV'
          import os, uuid
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              for key, value in sorted(os.environ.items()):
                  if key.startswith('NAKPANEL_'):
                      delimiter = uuid.uuid4().hex
                      output.write(f'{key}<<{delimiter}\n{value}\n{delimiter}\n')
          PYENV
      - name: Run every required native product and security gate
        shell: bash
        run: ./deploy/multipass/ubuntu-platform-verify.sh
      - name: Clean up only this cell's owned guests
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          source deploy/multipass/common.sh
          expected_token="ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${NAKPANEL_MULTIPASS_IMAGE//./-}-${NAKPANEL_MULTIPASS_ARCH}"
          if [[ "${NAKPANEL_CI_OWNERSHIP_READY:-}" != 1 || "${NAKPANEL_RUN_TOKEN:-}" != "${expected_token}" ]]; then exit 0; fi
          status=0
          # Enumerate only this run's host ownership records, never the VM inventory.
          for record in "${NAKPANEL_OWNERSHIP_DIR}/${NAKPANEL_RUN_TOKEN}"/nakpanel-*; do
            [[ -f "${record}" && "${record}" != *.image.json ]] || continue
            destroy_owned_vm "$(basename "${record}")" "${NAKPANEL_RUN_TOKEN}" || status=1
          done
          exit "${status}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-${{ matrix.release }}-${{ matrix.architecture }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/native-evidence-${{ matrix.release }}-${{ matrix.architecture }}/
            ${{ runner.temp }}/native-preflight-${{ matrix.release }}-${{ matrix.architecture }}.json
          if-no-files-found: error

  native-qualification-summary:
    if: always() && github.event_name == 'workflow_dispatch' && inputs.qualify_native
    name: complete native qualification evidence
    needs: [unit, security-suite, release-build, native-qualification]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: native-results
      - name: Require complete cells and identical per-architecture release manifests
        env:
          BASELINE_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYSUMMARY'
          import hashlib, json, os, pathlib, sys
          root = pathlib.Path('native-results')
          expected = {(release, arch) for release in ('26.04',) for arch in ('amd64', 'arm64')}
          cells, manifests, errors = {}, {}, []
          for path in root.rglob('report.json'):
              report = json.loads(path.read_text())
              cell = (report['release'], report['architecture'])
              if cell in cells:
                  errors.append('duplicate cell report: ' + '/'.join(cell))
              cells[cell] = report
              manifest = path.parent / 'release-manifest.json'
              if not manifest.is_file():
                  errors.append('signed release manifest missing: ' + '/'.join(cell))
              else:
                  manifests[cell] = hashlib.sha256(manifest.read_bytes()).hexdigest()
              if report.get('profile') != 'ubuntu-26.04-sury' or report.get('qualification_scope') != 'CURRENT_VERSION_ONLY' or report.get('full_php_parity') is not True or set(report.get('php_contract', [])) != {'8.3','8.4','8.5'}:
                  errors.append('required Ubuntu 26.04 multi-PHP contract missing: ' + '/'.join(cell))
              if report.get('qualification_passed') is not True:
                  errors.append('required cell gates did not pass: ' + '/'.join(cell))
          for cell in expected - cells.keys():
              errors.append('missing complete cell report: ' + '/'.join(cell))
          for cell in cells.keys() - expected:
              errors.append('unexpected cell report: ' + '/'.join(cell))
          baseline = json.loads(os.environ['BASELINE_RESULTS'])
          for job in ('unit', 'security-suite', 'release-build', 'native-qualification'):
              if baseline.get(job, {}).get('result') != 'success':
                  errors.append('required job did not pass: ' + job)
          result = dict(qualification_passed=not errors,
                        promotion_eligible=not errors and all(r.get('promotion_eligible') is True for r in cells.values()),
                        manifest_sha256={'/'.join(k):v for k,v in manifests.items()}, errors=errors)
          pathlib.Path('native-summary.json').write_text(json.dumps(result, indent=2) + '\n')
          for error in errors:
              print(error, file=sys.stderr)
          if errors:
              raise SystemExit(1)
          PYSUMMARY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: native-summary.json
          if-no-files-found: error
