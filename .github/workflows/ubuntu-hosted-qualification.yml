name: Hosted Ubuntu AMD64 qualification

on:
  push:
    branches: [codex/ubuntu-26-support]
  workflow_dispatch:
    inputs:
      diagnose_php_maintenance:
        description: Only reproduce PHP package recovery on a disposable 26.04 guest (not product qualification)
        type: boolean
        default: false
      diagnose_fwupd:
        description: Only diagnose fwupd on the pinned disposable 26.04 image (no product qualification)
        type: boolean
        default: false
      resolute_image_serial:
        description: Official Resolute cloud-image release serial
        type: string
        default: '20260927'
      resolute_image_sha256:
        description: Independently pinned Resolute AMD64 image SHA256 (also checked against signed Ubuntu sums)
        type: string
        default: '8800651811af9a85465ad1d552add729947bb16488dddb4a9b5305a3d97332b2'
      verify_database_manager:
        description: Require optional database manager browser and FastCGI coverage
        type: boolean
        default: true
      verify_sury_maintenance:
        description: After all Surý26 gates, require real same-version PHP delivery and failed-configuration recovery (no version advance)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: hosted-ubuntu-qualification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnose-fwupd:
    if: github.event.repository.private == false && inputs.diagnose_fwupd && !inputs.diagnose_php_maintenance
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Prepare this disposable hosted runner
        run: bash deploy/multipass/prepare-hosted-runner.sh
      - name: Diagnose firmware metadata refresh on the signed pinned image
        env:
          RESOLUTE_SERIAL: ${{ inputs.resolute_image_serial }}
          RESOLUTE_SHA256: ${{ inputs.resolute_image_sha256 }}
        run: bash deploy/multipass/fwupd-diagnostic.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fwupd-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fwupd-diagnostic/
          retention-days: 7
          if-no-files-found: error

  diagnose-php-maintenance:
    if: github.event.repository.private == false && inputs.diagnose_php_maintenance
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Require exactly one diagnostic selection
        env:
          FWUPD_REQUESTED: ${{ inputs.diagnose_fwupd }}
        run: test "${FWUPD_REQUESTED}" != true
      - name: Prepare this disposable hosted runner
        run: bash deploy/multipass/prepare-hosted-runner.sh
      - name: Reproduce actual PHP package failed-configuration recovery
        run: bash deploy/multipass/php-maintenance-diagnostic.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: php-maintenance-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/php-maintenance-diagnostic/
          retention-days: 7
          if-no-files-found: error

  signed-bundles:
    if: github.event.repository.private == false && !inputs.diagnose_fwupd && !inputs.diagnose_php_maintenance
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
      - uses: actions/setup-go@v5
        with:
          go-version-file: candidate/deploy/release/GO_VERSION
          cache-dependency-path: candidate/go.sum
      - name: Build the current AMD64 application with a test key
        shell: bash
        env:
          NAKPANEL_RELEASE_ARCHITECTURES: amd64
          NAKPANEL_RELEASE_ALLOW_DIRTY: '1'
        run: |
          set -euo pipefail
          output="${RUNNER_TEMP}/hosted-bundles"
          mkdir -p "${output}"
          umask 077
          openssl genrsa -out "${RUNNER_TEMP}/hosted-test-private.pem" 3072
          openssl pkey -in "${RUNNER_TEMP}/hosted-test-private.pem" -pubout -out "${output}/test-public.pem"
          export NAKPANEL_RELEASE_SIGNING_KEY="${RUNNER_TEMP}/hosted-test-private.pem"
          for tree in candidate; do
            printf '\n<!-- hosted development qualification %s -->\n' "${GITHUB_RUN_ID}" >>"${tree}/README.md"
            (cd "${tree}" && ./deploy/release/build.sh "${output}/${tree}")
          done
          python3 - "${output}" <<'PYBUNDLES'
          import json,pathlib,shutil,sys
          output=pathlib.Path(sys.argv[1]); result={'architecture':'amd64','development':True}
          for tree in ('candidate',):
              root=pathlib.Path(tree); version=(root/'VERSION').read_text().strip()
              name=f'nakpanel-{version}-linux-amd64'
              manifest=json.loads((output/tree/name/'manifest.json').read_text())
              assert manifest['development'] is True and manifest['architecture']=='amd64'
              result[tree]=dict(version=version,commit=manifest['commit'],archive=f'{tree}/{name}.tar.gz',directory=f'{tree}/{name}')
              shutil.rmtree(output/tree/name)
          (output/'bundles.json').write_text(json.dumps(result,indent=2)+'\n')
          PYBUNDLES
      - name: Verify and freeze official signed cloud-image selections
        shell: bash
        env:
          RESOLUTE_SERIAL: ${{ inputs.resolute_image_serial || '20260927' }}
          RESOLUTE_SHA256: ${{ inputs.resolute_image_sha256 || '8800651811af9a85465ad1d552add729947bb16488dddb4a9b5305a3d97332b2' }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ubuntu-keyring gnupg
          python3 - "${RUNNER_TEMP}/hosted-bundles" <<'PYIMAGES'
          import json,os,pathlib,re,subprocess,sys
          output=pathlib.Path(sys.argv[1]); images={}
          for release,suite in [('26.04','resolute')]:
              serial=os.environ[suite.upper()+'_SERIAL']; expected=os.environ[suite.upper()+'_SHA256'].lower()
              assert re.fullmatch(r'20[0-9]{6}(\.[0-9]+)?',serial), 'invalid image serial'
              assert re.fullmatch(r'[a-f0-9]{64}',expected), 'exact SHA256 required'
              base=f'https://cloud-images.ubuntu.com/releases/{suite}/release-{serial}/'
              directory=output/'images'/suite;directory.mkdir(parents=True)
              for name in ('SHA256SUMS','SHA256SUMS.gpg'):
                  subprocess.run(['curl','--fail','--location','--retry','3','--proto','=https','--proto-redir','=https',base+name,'--output',str(directory/name)],check=True)
              subprocess.run(['gpgv','--keyring','/usr/share/keyrings/ubuntu-cloudimage-keyring.gpg',str(directory/'SHA256SUMS.gpg'),str(directory/'SHA256SUMS')],check=True)
              filename=f'ubuntu-{release}-server-cloudimg-amd64.img'
              matches=[line.split()[0] for line in (directory/'SHA256SUMS').read_text().splitlines() if line.split()[-1].lstrip('*')==filename]
              assert matches==[expected], 'pinned SHA256 differs from signed Ubuntu release manifest'
              images[release]=dict(url=base+filename,sha256=expected,serial=serial,suite=suite)
          (output/'images.json').write_text(json.dumps(images,indent=2)+'\n')
          PYIMAGES
      - uses: actions/upload-artifact@v4
        with:
          name: hosted-development-bundles-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hosted-bundles/
          retention-days: 3
          if-no-files-found: error
      - name: Remove ephemeral private signing key
        if: always()
        run: rm -f "${RUNNER_TEMP}/hosted-test-private.pem"

  qualify-amd64:
    if: github.event.repository.private == false && !inputs.diagnose_fwupd && !inputs.diagnose_php_maintenance
    needs: signed-bundles
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - release: '26.04'
    env:
      NAKPANEL_MULTIPASS_ARCH: amd64
      NAKPANEL_MULTIPASS_IMAGE: ${{ matrix.release }}
      NAKPANEL_QUALIFICATION_PHP_PROVIDER: sury
      NAKPANEL_HOSTED_GUEST_FIRMWARE_POLICY: '1'
      NAKPANEL_RELEASE_ALLOW_DEVELOPMENT: '1'
      NAKPANEL_QUALIFICATION_VM_CPUS: '2'
      NAKPANEL_QUALIFICATION_VM_MEMORY: 5G
      NAKPANEL_QUALIFICATION_VM_DISK: 32G
      NAKPANEL_QUALIFICATION_DR_CPUS: '2'
      NAKPANEL_QUALIFICATION_DR_MEMORY: 3G
      NAKPANEL_QUALIFICATION_DR_DISK: 16G
      NAKPANEL_QUALIFICATION_RECLAIM_PRIOR: '1'
      NAKPANEL_VERIFY_DATABASE_MANAGER: ${{ (github.event_name == 'push' || inputs.verify_database_manager) && '1' || '0' }}
      NAKPANEL_VERIFY_SURY_MAINTENANCE: ${{ (github.event_name == 'push' || inputs.verify_sury_maintenance) && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: deploy/release/GO_VERSION
      - uses: actions/download-artifact@v4
        with:
          name: hosted-development-bundles-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hosted-bundles
      - name: Prepare only this disposable hosted runner
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${NAKPANEL_QUALIFICATION_PHP_PROVIDER}" == sury && "${NAKPANEL_VERIFY_SURY_MAINTENANCE}" == 1 && "${NAKPANEL_VERIFY_DATABASE_MANAGER}" != 1 ]]; then
            echo 'Surý maintenance requires the complete database-manager browser baseline' >&2
            exit 1
          fi
          bash deploy/multipass/prepare-hosted-runner.sh
      - name: Stage verified identical application artifacts and pinned local images
        shell: bash
        run: |
          set -euo pipefail
          python3 - "${RUNNER_TEMP}/hosted-bundles" "${RUNNER_TEMP}/hosted-images" <<'PYSTAGE'
          import hashlib,json,os,pathlib,subprocess,sys,tarfile,uuid
          bundles=pathlib.Path(sys.argv[1]); image_dir=pathlib.Path(sys.argv[2]);image_dir.mkdir()
          metadata=json.loads((bundles/'bundles.json').read_text());images=json.loads((bundles/'images.json').read_text())
          assert metadata['development'] is True and metadata['architecture']=='amd64'
          exports={}
          for tree,prefix in [('candidate','NAKPANEL_RELEASE_')]:
              entry=metadata[tree]
              with tarfile.open(bundles/entry['archive']) as archive:
                  for member in archive.getmembers():
                      path=pathlib.PurePosixPath(member.name)
                      assert not path.is_absolute() and '..' not in path.parts and not member.issym() and not member.islnk() and not member.isdev(), 'unsafe artifact archive'
                  archive.extractall(bundles/tree)
              exports[prefix+'BUNDLE']=str(bundles/entry['directory'])
              exports[prefix+'PUBLIC_KEY']=str(bundles/'test-public.pem')
              exports[prefix+'VERSION']=entry['version']
          for release,image in images.items():
              suite=image['suite'];filename=f'ubuntu-{release}-server-cloudimg-amd64.img'
              assert image['url'].startswith(f'https://cloud-images.ubuntu.com/releases/{suite}/release-'), 'untrusted image URL'
              subprocess.run(['gpgv','--keyring','/usr/share/keyrings/ubuntu-cloudimage-keyring.gpg',str(bundles/'images'/suite/'SHA256SUMS.gpg'),str(bundles/'images'/suite/'SHA256SUMS')],check=True)
              target=image_dir/filename
              subprocess.run(['curl','--fail','--location','--retry','3','--proto','=https','--proto-redir','=https',image['url'],'--output',str(target)],check=True)
              sha=hashlib.sha256()
              with target.open('rb') as source:
                  for block in iter(lambda:source.read(2**20),b''):sha.update(block)
              assert sha.hexdigest()==image['sha256'], 'cloud-image SHA256 mismatch'
              if release==os.environ['NAKPANEL_MULTIPASS_IMAGE']:
                  exports['NAKPANEL_MULTIPASS_IMAGE_SOURCE']=str(target);exports['NAKPANEL_MULTIPASS_IMAGE_SHA256']=image['sha256']
          with open(os.environ['GITHUB_ENV'],'a') as output:
              for key,value in sorted(exports.items()):
                  delimiter=uuid.uuid4().hex;output.write(f'{key}<<{delimiter}\n{value}\n{delimiter}\n')
          PYSTAGE
      - name: Prove KVM and measured capacity before any guest launch
        shell: bash
        run: |
          set -euo pipefail
          df -h / | tee "${RUNNER_TEMP}/hosted-evidence/disk-after.log"
          python3 deploy/multipass/hosted-runner-preflight.py --output "${RUNNER_TEMP}/hosted-evidence/host-preflight.json"
      - name: Initialize unique owned run
        shell: bash
        run: |
          set -euo pipefail
          source deploy/multipass/common.sh
          export NAKPANEL_RUN_TOKEN="hosted-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${NAKPANEL_MULTIPASS_IMAGE//./-}"
          export NAKPANEL_CELL_REPORT_DIR="${RUNNER_TEMP}/native-cell-${NAKPANEL_MULTIPASS_IMAGE}-amd64"
          init_qualification_run
          export NAKPANEL_CI_OWNERSHIP_READY=1
          python3 - <<'PYENV'
          import os,uuid
          with open(os.environ['GITHUB_ENV'],'a') as output:
              for key,value in sorted(os.environ.items()):
                  if key.startswith('NAKPANEL_'):
                      delimiter=uuid.uuid4().hex;output.write(f'{key}<<{delimiter}\n{value}\n{delimiter}\n')
          PYENV
      - name: Prepare required native Mail and optional database browser dependency
        shell: bash
        run: |
          set -euo pipefail
          google-chrome --version
          npm install --prefix "${RUNNER_TEMP}/qualification-browser" --no-audit --no-fund playwright@1.64.1
          cp "${RUNNER_TEMP}/qualification-browser/package-lock.json" "${RUNNER_TEMP}/hosted-evidence/browser-package-lock.json"
          echo "PLAYWRIGHT_MODULE=${RUNNER_TEMP}/qualification-browser/node_modules/playwright" >>"${GITHUB_ENV}"
      - name: Execute every required native product security upgrade and DR gate
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${NAKPANEL_QUALIFICATION_PHP_PROVIDER}" == sury && "${NAKPANEL_VERIFY_SURY_MAINTENANCE}" == 1 ]]; then
            python3 deploy/multipass/sury-maintenance-prepare.py qualify \
              --execution-receipt "${RUNNER_TEMP}/hosted-evidence/sury-maintenance-canonical-${NAKPANEL_RUN_TOKEN}.json"
          else
            ./deploy/multipass/ubuntu-platform-verify.sh
          fi
      - name: Record maintenance coverage and rehearse requested Surý26 same-version PHP recovery
        shell: bash
        run: |
          set -euo pipefail
          python3 deploy/multipass/sury-maintenance-prepare.py request
          if [[ "${NAKPANEL_MULTIPASS_IMAGE}" == 26.04 && "${NAKPANEL_QUALIFICATION_PHP_PROVIDER}" == sury && "${NAKPANEL_VERIFY_SURY_MAINTENANCE}" == 1 ]]; then
            python3 deploy/multipass/sury-maintenance-prepare.py prepare \
              --execution-receipt "${RUNNER_TEMP}/hosted-evidence/sury-maintenance-canonical-${NAKPANEL_RUN_TOKEN}.json" \
              --private-root "${RUNNER_TEMP}/sury-maintenance-private-${NAKPANEL_RUN_TOKEN}"
          fi
      - name: Always clean up only this run's proven owned guests
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          source deploy/multipass/common.sh
          expected="hosted-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${NAKPANEL_MULTIPASS_IMAGE//./-}"
          if [[ "${NAKPANEL_CI_OWNERSHIP_READY:-}" != 1 || "${NAKPANEL_RUN_TOKEN:-}" != "${expected}" ]]; then exit 0; fi
          status=0
          for record in "${NAKPANEL_OWNERSHIP_DIR}/${NAKPANEL_RUN_TOKEN}"/nakpanel-*; do
            [[ -f "${record}" && "${record}" != *.image.json ]] || continue
            destroy_owned_vm "$(basename "${record}")" "${NAKPANEL_RUN_TOKEN}" || status=1
          done
          exit "${status}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hosted-cell-${{ matrix.release }}-amd64-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/hosted-evidence/
            ${{ runner.temp }}/native-cell-${{ matrix.release }}-amd64/
            ${{ runner.temp }}/hosted-bundles/bundles.json
            ${{ runner.temp }}/hosted-bundles/images.json
          retention-days: 3
          if-no-files-found: error

  hosted-evidence-summary:
    if: always() && github.event.repository.private == false && !inputs.diagnose_fwupd && !inputs.diagnose_php_maintenance
    needs: [signed-bundles, qualify-amd64]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: hosted-cell-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: hosted-results
      - name: Require the complete Ubuntu 26.04 AMD64 cell and full PHP contract
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
          SURY_MAINTENANCE_REQUESTED: ${{ (github.event_name != 'workflow_dispatch' || inputs.verify_sury_maintenance) && '1' || '0' }}
        run: |
          python3 - <<'PYSUMMARY'
          import hashlib,json,os,pathlib,sys
          cells={};errors=[];digests={};maintenance={}
          for path in pathlib.Path('hosted-results').rglob('report.json'):
              report=json.loads(path.read_text());release=report['release']
              if release in cells: errors.append('duplicate cell '+release)
              cells[release]=report
              if report.get('release')!='26.04' or report.get('profile')!='ubuntu-26.04-sury' or report.get('full_php_parity') is not True: errors.append('complete Resolute multi-PHP contract required')
              if report.get('architecture')!='amd64' or report.get('qualification_passed') is not True: errors.append('incomplete native AMD64 cell '+release)
              if report.get('promotion_eligible') is not False or report.get('signature_class')!='development': errors.append('test artifact was incorrectly reported promotable '+release)
              manifest=path.parent/'release-manifest.json'
              if not manifest.is_file(): errors.append('missing current manifest '+release)
              else:
                  digests[release]=hashlib.sha256(manifest.read_bytes()).hexdigest()
                  payload=json.loads(manifest.read_text())
                  coverage=path.parent/'sury-maintenance-request.json'
                  if not coverage.is_file(): errors.append('missing explicit maintenance coverage '+release)
                  else:
                      proof=json.loads(coverage.read_text());maintenance[release]=proof
                      expected=release=='26.04' and os.environ['SURY_MAINTENANCE_REQUESTED']=='1'
                      if proof.get('schema')!='nakpanel-sury-maintenance-coverage-v1' or proof.get('requested') is not expected or proof.get('status')!=('PASS' if expected else 'NOT_REQUESTED'): errors.append('requested maintenance coverage incomplete '+release)
                      for key in ('source_vm','run_token','release','architecture','profile','php_provider'):
                          if proof.get(key)!=report.get(key):errors.append('maintenance source differs '+release+' '+key)
                      if proof.get('app_version')!=payload.get('version') or proof.get('runtime_commit')!=payload.get('commit') or proof.get('qualifier_commit')!=payload.get('commit') or proof.get('manifest_sha256')!=digests[release] or proof.get('installed_binary_sha256')!={name:payload['files']['bin/'+name] for name in ('panel','agent','panelctl')}:errors.append('maintenance payload differs '+release)
                      if proof.get('qualification_report_sha256')!=hashlib.sha256(path.read_bytes()).hexdigest() or proof.get('genuine_version_advance') is not False:errors.append('maintenance report/claim differs '+release)
                      if expected:
                          result_path=path.parent/'sury-maintenance'/'result.json'
                          if not result_path.is_file():errors.append('missing actual maintenance result '+release)
                          else:
                              actual=json.loads(result_path.read_text())
                              if proof.get('result_sha256')!=hashlib.sha256(result_path.read_bytes()).hexdigest() or actual.get('schema')!='nakpanel-sury-maintenance-result-v1' or actual.get('status')!='PASS' or actual.get('operation')!='SAME_VERSION_REINSTALL_AND_FAILED_CONFIGURATION_RECOVERY':errors.append('actual maintenance result failed '+release)
                              if any(actual.get(k)!=proof.get(k) for k in ('source_vm','run_token','runtime_commit','qualifier_commit')):errors.append('actual maintenance source differs '+release)
                              if any(actual.get(k) is not True for k in ('same_version_delivery','failed_configuration_recovery','two_reboots_verified')) or any(actual.get(k) is not False for k in ('genuine_version_advance','apt_version_rollback','application_rollback')) or actual.get('roundcube_send_read_steps')!=3 or type(actual.get('reboots')) is not list or len(actual.get('reboots',[]))!=2 or len(set(actual.get('reboots',[])))!=2:errors.append('actual recovery/reboot/product evidence incomplete '+release)
          if set(cells)!={'26.04'}:errors.append('the complete Ubuntu 26.04 report is required')
          if digests.get('26.04') is None:errors.append('current signed Ubuntu 26.04 artifact is missing')
          for job,status in json.loads(os.environ['JOB_RESULTS']).items():
              if status.get('result')!='success':errors.append('required job failed: '+job)
          result=dict(qualification_passed=not errors,promotion_eligible=False,architecture='amd64',development=True,manifest_sha256=digests,maintenance=maintenance,errors=errors)
          pathlib.Path('hosted-summary.json').write_text(json.dumps(result,indent=2)+'\n')
          for error in errors: print(error,file=sys.stderr)
          if errors:raise SystemExit(1)
          PYSUMMARY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hosted-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: hosted-summary.json
          retention-days: 3
          if-no-files-found: error
