function focusRow(id,action=false){const root=actionRoot(),row=root?.querySelector('[data-notification-id="'+id+'"]');if(row){row.querySelector(action?'.menu-anchor>.icon-button':'.message')?.focus();return}if(!$('#notification-preview').hidden)$('#notification-preview').focus();else $('#notification-bell').focus();}
function announce(message){$('#feedback').textContent=message;$('#feedback').hidden=false;clearTimeout(feedbackTimer);feedbackTimer=setTimeout(()=>$('#feedback').hidden=true,4500);}
function filters(root,kind='inbox'){root.replaceChildren();const selected=kind==='preview'?previewFilter:filter;for(const value of ['all','unread']){const button=el('button',value==='all'?'All':'Unread','filter-tab');button.type='button';button.setAttribute('aria-pressed',String(selected===value));button.addEventListener('click',event=>{event.stopPropagation();if(kind==='preview')previewFilter=value;else filter=value;renderLists();const active=root.querySelector('[aria-pressed="true"]');active?.focus();});root.append(button);}}
function row(n){
 const root=el('article',undefined,'notification-row'+(n.unread?' unread':''));root.dataset.notificationId=n.id;
 const badge=el('span',undefined,'notification-icon '+n.tone);badge.innerHTML=icon(n.icon);root.append(badge);
 const message=el('button',undefined,'message');message.type='button';message.setAttribute('aria-label',(n.unread?'Unread: ':'')+n.title+'. '+n.category+'. '+relative(n.time));
 message.append(el('span',n.title,'message-title'),el('span',n.summary,'message-summary'));
 const meta=el('span',undefined,'message-meta');meta.append(el('span',n.category),el('span','·'));const time=el('time',relative(n.time));time.dateTime=n.time;time.title=exactTime(n.time);meta.append(time);message.append(meta);message.addEventListener('click',()=>openDetail(n,message));root.append(message);
 const end=el('div',undefined,'row-end');if(n.unread){const dot=el('span',undefined,'unread-dot');dot.setAttribute('aria-hidden','true');end.append(dot);}
 const anchor=el('div',undefined,'menu-anchor'),more=el('button',undefined,'icon-button');more.type='button';more.innerHTML=icon('ellipsis');more.title='Actions for '+n.title;more.setAttribute('aria-label','Actions for '+n.title);more.setAttribute('aria-expanded',String(menuID===n.id));
 more.addEventListener('click',event=>{event.stopPropagation();menuID=menuID===n.id?null:n.id;renderLists();actionRoot()?.querySelector('[data-notification-id="'+n.id+'"] .row-menu button:not(:disabled)')?.focus();});anchor.append(more);
 if(menuID===n.id){const menu=el('div',undefined,'row-menu');menu.setAttribute('aria-label','Notification actions');const read=el('button',undefined);read.type='button';read.innerHTML=icon('mail');read.append(document.createTextNode(n.unread?'Mark as read':'Already read'));read.disabled=!n.unread;read.addEventListener('click',()=>{if(params.get('state')==='error'){showError('Could not mark this notification read. Try again.');focusRow(n.id,true);return}n.unread=false;menuID=null;renderLists();focusRow(n.id,true);announce('Notification marked read.');});const archive=el('button',undefined);archive.type='button';archive.innerHTML=icon('archive');archive.append(document.createTextNode('Archive'));archive.addEventListener('click',()=>{const siblings=[...actionRoot().querySelectorAll('[data-notification-id]')].map(node=>Number(node.dataset.notificationId)),index=siblings.indexOf(n.id),next=siblings[index+1]??siblings[index-1];archived.add(n.id);menuID=null;renderLists();focusRow(next);announce('Notification archived.');});menu.append(read,archive);anchor.append(menu);}
 end.append(anchor);root.append(end);return root;
}
function showError(message){$('#preview-error').textContent=message;$('#preview-error').hidden=false;menuID=null;renderLists();}
function empty(root,kind='inbox'){const selected=kind==='preview'?previewFilter:filter,query=kind==='preview'?'':search;const box=el('div',undefined,'empty-state');box.innerHTML=icon('bell');box.append(el('h3',query?'No matching notifications':selected==='unread'?'All caught up':'No notifications yet'),el('p',query?'Try another title, resource or message.':selected==='unread'?'You have no unread notifications.':'Account and hosting updates will appear here.'));root.append(box);}
function renderLists(){
 const count=unreadCount();$('#notification-bell').innerHTML=icon('bell')+(count?'<span class="bell-count">'+count+'</span>':'');$('#notification-bell').setAttribute('aria-label','Notifications'+(count?', '+count+' unread':''));$('#preview-count').textContent=count?count+' unread':'';$('#preview-read-all').disabled=count===0;
 filters($('#preview-filters'),'preview');const preview=$('#preview-list');preview.replaceChildren();const quick=visible('preview'),list=visible();if(quick.length)quick.slice(0,5).forEach(n=>preview.append(row(n)));else empty(preview,'preview');
 const full=$('#inbox-groups');if(full){filters($('#inbox-filters'));full.replaceChildren();for(const [group,predicate]of [['Today',n=>n.time.startsWith('2026-10-28')],['Yesterday',n=>!n.time.startsWith('2026-10-28')]]){const groupItems=list.filter(predicate);if(!groupItems.length)continue;full.append(el('h2',group,'date-group'));const panel=el('div',undefined,'inbox-list');groupItems.forEach(n=>panel.append(row(n)));full.append(panel);}if(!list.length)empty(full);$('#inbox-read-all').disabled=count===0;$('#inbox-total').textContent=count?count+' unread':'All read';}
}
function nav(){const main=[['home','Home'],['users','Customers'],['users','Resellers'],['globe','Websites'],['card','Subscriptions'],['layers','Service Plans'],['activity','Activity'],['settings','Tools & Settings']];const root=$('#primary-nav');for(const [symbol,title]of main){if(title==='Customers')root.append(el('div','HOSTING SERVICES','rail-label'));if(title==='Activity')root.append(el('div','SERVER MANAGEMENT','rail-label'));const link=el('a',undefined,'nav-item'+((surface==='inbox'?title==='Activity':title==='Service Plans')?' active':''));link.href=title==='Activity'?'?view=inbox':'?view=preview';link.innerHTML=icon(symbol);link.append(document.createTextNode(title));root.append(link);}}
function plan(){return '<div class="crumb"><a href="?view=preview">Service Plans</a> <span class="quiet"> / Business</span></div><div class="heading-row"><div><p class="eyebrow">Service plan</p><h1>Business</h1><p>Resources and services for your hosting customers.</p></div><button class="command" type="button" disabled>Back to plans</button></div><nav class="context-tabs" aria-label="Plan sections"><a href="#">Overview</a><a href="#" class="active">Resources</a><a href="#">Services</a><a href="#">Customer permissions</a><a href="#">Defaults</a></nav><section class="plan-panel"><h2>Resources</h2><p>Set the allocations available to each subscription on this plan.</p><div class="resource-grid"><label class="field">Websites<input value="5" inputmode="numeric"><small>Hosted primary and add-on domains</small></label><label class="field">Disk space<input value="25 GB"><small>Total subscription storage</small></label><label class="field">Monthly traffic<input value="Unlimited"><small>Measured monthly usage</small></label><label class="field">Subdomains<input value="Unlimited"></label><label class="field">Databases<input value="10"></label><label class="field">Mailboxes<input value="25"></label><label class="field">Backup storage<input value="25 GB"></label><label class="field">Backup retention<input value="30 days"></label><label class="field">WordPress installations<input value="5"></label></div><p class="plan-note">'+icon('shield-check')+'Locked and custom subscriptions keep their current limits.</p><div class="plan-footer"><button class="command" type="button" disabled>Cancel</button><button class="command primary" type="button" disabled>Update & sync</button></div></section>';}
function inbox(){return '<div class="heading-row"><div><p class="eyebrow">Workspace</p><h1>Activity</h1><p>Updates, background tasks and issues that need attention.</p></div></div><nav class="context-tabs" aria-label="Activity views"><a href="#">Issues <span class="tab-count">1</span></a><a href="#">Tasks <span class="tab-count">1</span></a><a href="#">History</a><a class="active" href="?view=inbox" aria-current="page">Notifications</a></nav><div class="inbox-toolbar"><div class="inbox-filter"><div class="panel-filter" id="inbox-filters" aria-label="Inbox filter"></div><label class="inbox-search">'+icon('search')+'<input id="inbox-search" aria-label="Search notifications" placeholder="Search notifications"></label></div><div class="inbox-actions"><span class="quiet" id="inbox-total"></span><button class="command" id="inbox-read-all" type="button">'+icon('mail')+'Mark all read</button></div></div><p class="scope-label">All resources in your workspace</p><div id="inbox-groups"></div>';}
function setSurface(next,push=true){surface=next;$('#notification-preview').hidden=true;$('#notification-bell').setAttribute('aria-expanded','false');$('#main-content').innerHTML=surface==='inbox'?inbox():plan();$('#page-label').textContent=surface==='inbox'?'Activity':'Service Plans';$('#primary-nav').replaceChildren();nav();if(surface==='inbox'){$('#inbox-search').addEventListener('input',event=>{search=event.target.value.toLowerCase();renderLists();});$('#inbox-read-all').addEventListener('click',readAll);}if(push){const url=new URL(location.href);url.searchParams.set('view',surface);history.pushState({},'',url);}renderLists();}
function openDetail(n,trigger){opener=trigger;n.unread=false;$('#notification-preview').hidden=true;$('#notification-bell').setAttribute('aria-expanded','false');$('#detail-title').textContent=n.title;const body=$('#detail-body');body.replaceChildren(el('p',n.detail));const metadata=el('dl',undefined,'detail-metadata');for(const [key,value]of [['Resource',n.category],['Received',exactTime(n.time)],['Status','Read']]){metadata.append(el('dt',key),el('dd',value));}body.append(metadata);if(n.issue)body.append(el('p','This issue is still open. Reading or archiving this message does not resolve it.','detail-notice'));$('#detail-note').textContent=n.issue?'Issue status remains unchanged.':'Read status is personal to your account.';renderLists();$('#notification-detail').showModal();$('#detail-close').focus();}
function closeDetail(){$('#notification-detail').close();if(opener?.isConnected)opener.focus();else $('#notification-bell').focus();}
function readAll(){if(params.get('state')==='error'){showError('Could not mark notifications read. No read status was changed.');return}items.forEach(n=>{if(!archived.has(n.id))n.unread=false;});menuID=null;renderLists();announce('All notifications in this workspace marked read.');}
$('#notification-bell').addEventListener('click',event=>{event.stopPropagation();const panel=$('#notification-preview'),open=panel.hidden;panel.hidden=!open;$('#notification-bell').setAttribute('aria-expanded',String(open));menuID=null;renderLists();if(open)panel.focus();});
$('#preview-close').innerHTML=icon('x');$('#preview-close').addEventListener('click',()=>{$('#notification-preview').hidden=true;$('#notification-bell').setAttribute('aria-expanded','false');$('#notification-bell').focus();});$('#preview-read-all').innerHTML=icon('mail');$('#preview-read-all').addEventListener('click',readAll);$('#footer-icon').innerHTML=icon('chevron-right');$('#search-icon').innerHTML=icon('search');$('#mobile-nav').innerHTML=icon('menu');$('#mobile-nav').addEventListener('click',()=>announce('Navigation is not part of this design review.'));$('#tasks-button').addEventListener('click',()=>announce('One background task is running.'));$('#detail-close').innerHTML=icon('x');$('#detail-close').addEventListener('click',closeDetail);$('#detail-done').addEventListener('click',closeDetail);$('#notification-detail').addEventListener('cancel',event=>{event.preventDefault();closeDetail();});$('#view-inbox').addEventListener('click',event=>{event.preventDefault();filter='all';search='';setSurface('inbox');});
document.addEventListener('click',event=>{if(!event.target.closest('.bell-wrap')&&!event.target.closest('.notification-row')){$('#notification-preview').hidden=true;$('#notification-bell').setAttribute('aria-expanded','false');if(menuID!==null){menuID=null;renderLists();}}});document.addEventListener('keydown',event=>{if(event.key==='Escape'&&!$('#notification-detail').open){if(menuID!==null){const id=menuID;menuID=null;renderLists();focusRow(id,true);return}$('#notification-preview').hidden=true;$('#notification-bell').setAttribute('aria-expanded','false');$('#notification-bell').focus();}});window.addEventListener('popstate',()=>{const p=new URLSearchParams(location.search);setSurface(p.get('view')==='inbox'?'inbox':'preview',false);});
setSurface(surface,false);if(surface==='preview'){$('#notification-preview').hidden=false;$('#notification-bell').setAttribute('aria-expanded','true');}
if(params.get('state')==='offline'){$('#connection-note').innerHTML=icon('triangle-alert')+'<span>Connection interrupted. Showing the last known updates.</span>';$('#connection-note').hidden=false;}
</script>
</body>
