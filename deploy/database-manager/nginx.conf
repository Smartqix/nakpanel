daemon off;
pid /run/nakpanel-database-manager/http.pid;
error_log /dev/null crit;
worker_processes 1;
events { worker_connections 64; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    client_body_temp_path /var/lib/nakpanel-database-manager/tmp/body;
    fastcgi_temp_path /var/lib/nakpanel-database-manager/tmp/fastcgi;
    client_max_body_size 17m;
    client_body_timeout 30s;
    send_timeout 65s;
    limit_conn_zone $server_name zone=manager:1m;
    server {
        listen 127.0.0.1:9082;
        server_name localhost;
        root /opt/nakpanel-database-manager/current;
        index index.php;
        limit_conn manager 8;
        location = /__nakpanel_health {
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /etc/nakpanel-database-manager/health.php;
            fastcgi_pass unix:/run/nakpanel-database-manager/fpm.sock;
            fastcgi_read_timeout 3s;
        }
        location = /index.php {
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /opt/nakpanel-database-manager/current/index.php;
            fastcgi_param HTTPS on;
            fastcgi_pass unix:/run/nakpanel-database-manager/fpm.sock;
            fastcgi_read_timeout 65s;
            fastcgi_hide_header X-Powered-By;
        }
        location = /js/messages.php {
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /opt/nakpanel-database-manager/current/js/messages.php;
            fastcgi_param HTTPS on;
            fastcgi_pass unix:/run/nakpanel-database-manager/fpm.sock;
            fastcgi_read_timeout 65s;
            fastcgi_hide_header X-Powered-By;
        }
        location / { try_files $uri $uri/ =404; }
        location ~* (?:^/setup|^/examples|^/test|^/libraries|^/vendor|^/templates|^/doc|/\.|\.php$|\.json$|\.sql$) { deny all; }
    }
}
