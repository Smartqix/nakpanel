[global]
daemonize = no
error_log = syslog
pid = /run/nakpanel-database-manager/fpm.pid

[manager]
user = nakpanel-dbmgr
group = nakpanel-dbmgr
listen = /run/nakpanel-database-manager/fpm.sock
listen.mode = 0600
pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 15s
pm.max_requests = 200
request_terminate_timeout = 65s
clear_env = yes
catch_workers_output = no
security.limit_extensions = .php
php_admin_value[auto_prepend_file] = /etc/nakpanel-database-manager/prepend.php
php_admin_value[open_basedir] = /opt/nakpanel-database-manager:/etc/nakpanel-database-manager:/var/lib/nakpanel-database-manager:/run/nakpanel-db-manager:/run/mysqld
php_admin_value[upload_tmp_dir] = /var/lib/nakpanel-database-manager/tmp
php_admin_value[sys_temp_dir] = /var/lib/nakpanel-database-manager/tmp
php_value[session.save_path] = /var/lib/nakpanel-database-manager/grants
php_admin_value[session.gc_maxlifetime] = 900
php_admin_flag[session.cookie_secure] = on
php_admin_flag[session.cookie_httponly] = on
php_admin_flag[session.use_strict_mode] = on
php_admin_flag[session.use_only_cookies] = on
php_admin_value[session.cookie_samesite] = Strict
php_admin_value[upload_max_filesize] = 16M
php_admin_value[post_max_size] = 17M
php_admin_value[memory_limit] = 128M
php_admin_value[max_execution_time] = 60
php_admin_value[max_input_time] = 60
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = off
php_admin_flag[expose_php] = off
php_admin_flag[allow_url_fopen] = off
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec,putenv
