# Fail2ban filter for nakpanel panel login failures.
#
# The panel logs authentication failures to journald via stderr, so this
# filter uses the systemd backend (see the nakpanel jail configuration) and
# matches on the structured "nakpanel-auth:" line the panel emits. The Go
# stdlib logger prefixes its own timestamp inside MESSAGE, so the expression
# is deliberately not anchored to the start of the line.

[Definition]
journalmatch = _SYSTEMD_UNIT=nakpanel.service
failregex = nakpanel-auth: login failed for "[^"]*" from <HOST>\s*$
ignoreregex =
